<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FUT Card Creator — {% block title %}{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Rajdhani:wght@400;500;600;700&family=Share+Tech+Mono&display=swap"
      rel="stylesheet"
    />
    <!-- Powered by Jinja2 template engine | card_renderer v2.1 -->
    <style>
      :root {
        --gold:        #c9a84c;
        --gold-light:  #f0d080;
        --gold-dark:   #7a5c1e;
        --bg:          #0a0a0f;
        --surface:     #111118;
        --surface2:    #1a1a26;
        --border:      #2a2a3a;
        --text:        #e8e8f0;
        --text-muted:  #7070a0;
        --red:         #e05050;
        --green:       #50c878;
      }

      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      body {
        background: var(--bg);
        color: var(--text);
        font-family: 'Rajdhani', sans-serif;
        font-size: 16px;
        min-height: 100vh;
        background-image:
          radial-gradient(ellipse 80% 50% at 50% -10%, rgba(201,168,76,0.08) 0%, transparent 60%),
          repeating-linear-gradient(0deg, transparent, transparent 60px, rgba(255,255,255,0.01) 60px, rgba(255,255,255,0.01) 61px),
          repeating-linear-gradient(90deg, transparent, transparent 60px, rgba(255,255,255,0.01) 60px, rgba(255,255,255,0.01) 61px);
      }

      /* ── NAV ── */
      nav {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 2.5rem;
        height: 64px;
        background: rgba(10,10,15,0.95);
        border-bottom: 1px solid var(--gold-dark);
        backdrop-filter: blur(10px);
        position: sticky;
        top: 0;
        z-index: 100;
      }

      .nav-logo {
        font-family: 'Bebas Neue', sans-serif;
        font-size: 1.6rem;
        letter-spacing: 3px;
        color: var(--gold);
        text-decoration: none;
      }

      .nav-logo span { color: var(--text-muted); font-size: 0.9rem; letter-spacing: 1px; margin-left: 8px; font-family: 'Rajdhani', sans-serif; }

      .nav-links { display: flex; gap: 0.5rem; }

      .nav-links a {
        color: var(--text-muted);
        text-decoration: none;
        font-size: 0.85rem;
        font-weight: 600;
        letter-spacing: 2px;
        text-transform: uppercase;
        padding: 0.4rem 1rem;
        border: 1px solid transparent;
        border-radius: 3px;
        transition: all 0.2s;
      }

      .nav-links a:hover, .nav-links a.active {
        color: var(--gold);
        border-color: var(--gold-dark);
        background: rgba(201,168,76,0.06);
      }

      /* ── PAGE WRAPPER ── */
      .page {
        max-width: 1100px;
        margin: 0 auto;
        padding: 3rem 2rem;
      }

      .page-header {
        text-align: center;
        margin-bottom: 3rem;
      }

      .page-header h1 {
        font-family: 'Bebas Neue', sans-serif;
        font-size: 3.5rem;
        letter-spacing: 6px;
        color: var(--gold);
        line-height: 1;
      }

      .page-header p {
        color: var(--text-muted);
        font-size: 0.9rem;
        letter-spacing: 2px;
        text-transform: uppercase;
        margin-top: 0.5rem;
      }

      .divider {
        width: 80px;
        height: 2px;
        background: linear-gradient(90deg, transparent, var(--gold), transparent);
        margin: 1rem auto;
      }

      /* ── ALERTS ── */
      .alert {
        padding: 0.9rem 1.2rem;
        border-radius: 4px;
        margin-bottom: 1.5rem;
        font-weight: 600;
        font-size: 0.9rem;
        letter-spacing: 0.5px;
        border-left: 3px solid;
      }
      .alert-error  { background: rgba(224,80,80,0.1);  border-color: var(--red);   color: #ff9090; }
      .alert-success{ background: rgba(80,200,120,0.1); border-color: var(--green); color: #90ffb0; }

      /* ── BUTTONS ── */
      .btn {
        display: inline-block;
        font-family: 'Rajdhani', sans-serif;
        font-weight: 700;
        font-size: 0.85rem;
        letter-spacing: 2px;
        text-transform: uppercase;
        padding: 0.65rem 1.8rem;
        border-radius: 3px;
        cursor: pointer;
        text-decoration: none;
        border: none;
        transition: all 0.2s;
      }

      .btn-gold {
        background: linear-gradient(135deg, var(--gold-dark), var(--gold));
        color: #0a0a0f;
      }
      .btn-gold:hover { filter: brightness(1.15); transform: translateY(-1px); }

      .btn-outline {
        background: transparent;
        color: var(--gold);
        border: 1px solid var(--gold-dark);
      }
      .btn-outline:hover { background: rgba(201,168,76,0.08); }

      .btn-danger {
        background: rgba(224,80,80,0.15);
        color: var(--red);
        border: 1px solid rgba(224,80,80,0.3);
      }
      .btn-danger:hover { background: rgba(224,80,80,0.25); }

      {% block extra_styles %}{% endblock %}
    </style>
  </head>
  <body>
    <nav>
      <a href="/dashboard" class="nav-logo">FUT CARDS</a>
      <div class="nav-links">
        <a href="/dashboard" {% if request.path == '/dashboard' %}class="active"{% endif %}>Dashboard</a>
        <a href="/create"    {% if request.path == '/create'    %}class="active"{% endif %}>Create Team</a>
        <a href="/view"      {% if request.path == '/view'      %}class="active"{% endif %}>View Team</a>
      </div>
    </nav>

    <div class="page">{% block content %}{% endblock %}</div>
  </body>
</html>
